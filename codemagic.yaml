# KiSA — Codemagic CI/CD
# iOS ilovani avtomatik build qilib App Store Connect / TestFlight ga yuboradi.
# Mac kerak emas — Codemagic macOS serverlarida build qiladi.
#
# OLDINDAN KERAK (DEPLOYMENT.md ga qarang):
#   1. Apple Developer Program a'zoligi ($99/yil)
#   2. App Store Connect da ilova yaratilgan (Bundle ID: com.kisa.finance)
#   3. App Store Connect API key Codemagic UI ga "Codemagic Key" nomi bilan ulangan
#   4. Quyidagi APP_STORE_APPLE_ID raqamini o'z ilovangiznikiga almashtiring
#   5. Codemagic UI → Environment variables → "ios_signing" guruhiga
#      CERTIFICATE_PRIVATE_KEY (Secure) qo'shilgan. Bir marta yarating:
#        openssl genrsa -out cert_key.pem 2048
#      va cert_key.pem ichidagi matnni to'liq qo'ying. Shu kalit doimiy
#      bo'lgani uchun har build'da YANGI sertifikat yaratilmaydi — Apple
#      Distribution sertifikatlari sonini cheklaydi (bir necha dona).

workflows:
  ios-testflight:
    name: KiSA iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # main branchга har push qilinganda avtomatik build (webhook orqali)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    integrations:
      # Codemagic UI dagi App Store Connect API key nomi (aynan mos bo'lishi shart)
      app_store_connect: "Codemagic Key"

    environment:
      groups:
        - ios_signing # CERTIFICATE_PRIVATE_KEY
      vars:
        # App Store Connect dagi ilovaning Apple ID raqami
        APP_STORE_APPLE_ID: 6780032147
        BUNDLE_ID: "com.kisa.finance"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter paketlarini olish
        script: flutter pub get

      - name: Analiz va testlar
        # Xato bo'lsa build shu yerda to'xtaydi — TestFlight'ga buzuq versiya ketmaydi
        script: |
          flutter analyze
          flutter test

      - name: Imzolash sertifikat va profilini yaratish/olish
        script: |
          keychain initialize
          # Doimiy kalit bilan mavjud sertifikat va profilni olamiz; faqat
          # birinchi marta (yo'q bo'lsa) yangisi yaratiladi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="$CERTIFICATE_PRIVATE_KEY" \
            --create
          # Sertifikatni keychain'ga qo'shib, profilni Xcode loyihasiga qo'llaymiz
          keychain add-certificates
          xcode-project use-profiles

      - name: CocoaPods o'rnatish
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: IPA build (avtomatik build raqami)
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - jalol0911j@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # IPA App Store Connect'ga yuklanadi. Ichki (internal) TestFlight
        # testerlari buildni avtomatik oladi — beta review kerak emas.
        # Tashqi (external) test uchun submit_to_testflight: true qo'shing,
        # lekin u Apple beta review va to'liq test ma'lumotlarini talab qiladi.
        submit_to_testflight: false
